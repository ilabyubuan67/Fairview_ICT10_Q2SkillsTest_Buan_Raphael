
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Periodic Nonmetal Checker</title>

    <!-- PyScript -->
    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2025.3.1/core.css"
    >
    <script
        type="module"
        src="https://pyscript.net/releases/2025.3.1/core.js"
    ></script>

    <!-- Styling -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #e8f0e9;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 18px;
            background-color: rgb(250, 242, 242);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header {
            margin-bottom: 25px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 8px;
            color: #064e1c;
            font-size: 28px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            color: white;
            background-color: #064e1c;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b6b2b;
        }

        #output1 {
            min-height: 55px;
            margin-top: 22px;
            padding: 15px;
            border-radius: 8px;
            color: #1e293b;
            background-color: #f1f5f9;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        #output1 p {
            margin-bottom: 5px;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Nonmetal Symbols</h1>
            <p>Enter a nonmetal element symbol to find its information.</p>
        </header>

        <div class="form-group">
            <label for="element_symbol">
                Nonmetal Element Symbol
            </label>

            <input
                type="text"
                id="element_symbol"
                placeholder="e.g., O, Ar, He"
            >
        </div>
<!-- Result Button -->
        <button py-click="add_element">
            Search Element
        </button>

        <div id="output1">
            <p>Element information will appear here.</p>
        </div>

        <p class="footer">Official Periodic Table</p>

    </main>

    <script type="py" src="main.py"></script>

</body>
</html>
